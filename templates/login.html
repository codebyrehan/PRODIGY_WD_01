{% extends 'base.html' %}{% block title %}Login — SecureAuth{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-card"><span class="eyebrow">SECURE LOGIN</span><h1>Welcome back</h1><p class="muted">Sign in to access your protected dashboard.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username or email<input name="identifier" value="{{ identifier|default('') }}" autocomplete="username" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" autocomplete="current-password" required placeholder="Your password"></label><button class="button primary full" type="submit">Sign in</button></form><p class="switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div></section>{% endblock %}
