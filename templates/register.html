{% extends 'base.html' %}{% block title %}Create Account — SecureAuth{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-card"><span class="eyebrow">SECURE REGISTRATION</span><h1>Create your account</h1><p class="muted">Set up your credentials to access the protected dashboard.</p><form method="post" novalidate><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" value="{{ username|default('') }}" autocomplete="username" required minlength="3" maxlength="30" placeholder="your_username"></label><label>Email<input type="email" name="email" value="{{ email|default('') }}" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters"></label><label>Confirm password<input type="password" name="confirm_password" autocomplete="new-password" required minlength="8" placeholder="Repeat your password"></label><button class="button primary full" type="submit">Create account</button></form><p class="switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p></div></section>{% endblock %}
